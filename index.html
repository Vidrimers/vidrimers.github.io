<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3; url=https://vidrimers.su">
  <link rel="canonical" href="https://vidrimers.su">
  <title>Перенаправление — Vidrimers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
      color: #a78bfa;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(167,139,250,0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p {
      font-size: 0.95rem;
      color: #888;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 0.65rem 1.8rem;
      background: #a78bfa;
      color: #0f0f0f;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    a:hover { background: #c4b5fd; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">VIDRIMERS.SU</div>
    <div class="spinner"></div>
    <p>Перенаправление...</p>
    <a href="https://vidrimers.su">vidrimers.su</a>
  </div>
</body>
</html>
